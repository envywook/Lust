name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare verified native dependencies
        run: ./scripts/prepare-native-deps.sh

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.LUST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUST_KEY_PASSWORD }}
        run: bash scripts/restore-release-signing.sh

      - name: Test, lint and build APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease --stacktrace
          else
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
          fi

      - name: Stage APK variants
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            apks=(app/build/outputs/apk/release/app-*-release.apk)
            suffix=release
          else
            apks=(app/build/outputs/apk/debug/app-*-debug.apk)
            suffix=debug
          fi
          test "${#apks[@]}" -eq 5
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            bash scripts/verify-release-signature.sh "${apks[@]}"
          fi
          safe_ref="${GITHUB_REF_NAME//\//-}"
          for apk in "${apks[@]}"; do
            variant="$(basename "${apk}" | sed -E "s/^app-(.*)-${suffix}\\.apk$/\\1/")"
            cp "${apk}" "dist/Lust-${safe_ref}-${variant}.apk"
          done
          (cd dist && sha256sum *.apk | sort | tee SHA256SUMS.txt)

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lust-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [XRAY, SING_BOX]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare verified native dependencies
        run: ./scripts/prepare-native-deps.sh

      - name: Build x86_64 APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Run API 34 VPN smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            apk=app/build/outputs/apk/debug/app-x86_64-debug.apk
            bash scripts/seed-android-smoke.sh "${{ matrix.engine }}" "${apk}"
            SKIP_APK_INSTALL=1 EXPECT_ENGINE="${{ matrix.engine }}" bash scripts/android-vpn-smoke.sh "${apk}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download verified APK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Lust-${{ github.sha }}
          path: dist

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "${GITHUB_REF_NAME}" docs/release-notes.md /tmp/current-release-notes.md <<'PY'
          from pathlib import Path
          import sys

          tag, source, destination = sys.argv[1:]
          lines = Path(source).read_text().splitlines()
          heading = f"# Lust {tag}"
          try:
              start = lines.index(heading)
          except ValueError:
              raise SystemExit(f"Release notes heading not found: {heading}")
          end = next((index for index in range(start + 1, len(lines)) if lines[index] == "---"), len(lines))
          Path(destination).write_text("\n".join(lines[start:end]).rstrip() + "\n")
          PY
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lust ${GITHUB_REF_NAME}" \
            --notes-file /tmp/current-release-notes.md \
            --prerelease \
            --verify-tag
